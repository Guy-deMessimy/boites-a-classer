<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Administration · Boîtes à classer</title>
  <link rel="icon" href="../icone.png">
  <style>
    /* Page d'administration : comptes, statistiques, mot de passe oublié, consultation du travail d'un élève.
       Réservée aux comptes admin : le serveur vérifie chaque appel (functions/api/admin/[action].js). */
    @font-face {
      font-family: "Space Grotesk";
      font-weight: 300 700;
      font-display: swap;
      src: url(../polices/space-grotesk-latin.woff2) format("woff2");
    }
    :root {
      --fond: #f6f4ef;
      --carte: #ffffff;
      --encre: #1f2430;
      --doux: #5f6675;
      --ligne: #e2ddd2;
      --accent: #2f6fde;
      --accent-encre: #ffffff;
      --accent-doux: #e8effc;
      --faux: #c0392b;
      --ok: #1f9d55;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #15171c;
        --carte: #1e2128;
        --encre: #ecedf0;
        --doux: #a3a8b4;
        --ligne: #30343d;
        --accent: #5b8ff0;
        --accent-encre: #0d1220;
        --accent-doux: #1f2a40;
        --faux: #ef6b5b;
        --ok: #4cc685;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fond); color: var(--encre); font: 16px/1.5 "Space Grotesk", system-ui, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 24px; }
    header h1 { margin: 0; font-size: 1.6rem; }
    header .moi { margin-left: auto; color: var(--doux); }
    a { color: var(--accent); }
    .bouton {
      display: inline-block;
      padding: .35rem .8rem;
      border: 1px solid var(--ligne);
      border-radius: 999px;
      background: var(--carte);
      color: var(--encre);
      font: inherit;
      font-size: .9rem;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .bouton:hover { border-color: var(--accent); }
    .bouton[aria-disabled="true"] { opacity: .4; pointer-events: none; }
    .bouton.danger { color: var(--faux); }
    .bouton.danger.confirmer { background: var(--faux); border-color: var(--faux); color: #fff; }
    .avis { padding: 16px 20px; border: 1px solid var(--ligne); border-radius: 16px; background: var(--carte); }
    .avis p { margin: 0 0 12px; }
    .connexion { display: flex; flex-wrap: wrap; gap: 8px; }
    .connexion input, .outils input {
      flex: 1 1 200px;
      padding: .45rem .8rem;
      border: 1px solid var(--ligne);
      border-radius: 999px;
      background: var(--carte);
      color: var(--encre);
      font: inherit;
    }
    .bouton.principal { background: var(--accent); border-color: var(--accent); color: var(--accent-encre); }
    .etat-site {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px;
      margin: 0 0 24px; padding: 16px 20px; border: 2px solid var(--ok); border-radius: 16px; background: var(--carte);
    }
    .etat-site span { display: block; color: var(--doux); font-size: .9rem; }
    .etat-site.arrete { border-color: var(--faux); }
    .etat-site.arrete strong { color: var(--faux); }
    .etat-site .bouton { padding: .55rem 1.1rem; font-size: 1rem; font-weight: 600; }
    .bouton.arreter { background: var(--faux); border-color: var(--faux); color: #fff; }
    .bouton.rouvrir { background: var(--ok); border-color: var(--ok); color: #fff; }
    .chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0 0 24px; padding: 0; list-style: none; }
    .chiffres li { padding: 14px 16px; border: 1px solid var(--ligne); border-radius: 16px; background: var(--carte); }
    .chiffres strong { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
    .chiffres span { color: var(--doux); font-size: .9rem; }
    .outils { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .defile { overflow-x: auto; border: 1px solid var(--ligne); border-radius: 16px; background: var(--carte); }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--ligne); vertical-align: middle; }
    th { color: var(--doux); font-weight: 600; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    td.nombre { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    td.actions { min-width: 220px; }
    td.actions .bouton { margin: 2px 0; }
    td.date { min-width: 9em; }
    .badge { margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--accent-doux); color: var(--accent); font-size: .78rem; font-weight: 600; }
    .resultat td { background: var(--accent-doux); }
    .resultat code { padding: 2px 8px; border-radius: 6px; background: var(--carte); font-size: 1.05rem; font-weight: 700; user-select: all; }
    .message { min-height: 1.5em; margin: 12px 0 0; font-weight: 600; }
    .message.erreur { color: var(--faux); }
    .vide { padding: 16px; color: var(--doux); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🛠 Administration</h1>
      <span class="moi" id="moi"></span>
      <a class="bouton" href="../app/index.html">Ouvrir le logiciel</a>
      <button type="button" class="bouton" id="deconnecter" hidden>Se déconnecter</button>
    </header>

    <div id="hors-session" class="avis" hidden>
      <p id="raison">Cette page est réservée aux comptes administrateurs.</p>
      <form id="form-connexion" class="connexion">
        <input id="identifiant" type="text" placeholder="Identifiant" autocomplete="username" autocapitalize="off" spellcheck="false" aria-label="Identifiant" required>
        <input id="mdp" type="password" placeholder="Mot de passe" autocomplete="current-password" aria-label="Mot de passe" required>
        <button type="submit" class="bouton principal">Se connecter</button>
      </form>
      <p class="message erreur" id="erreur-connexion" role="alert"></p>
    </div>

    <div id="contenu" hidden>
      <section class="etat-site" id="etat-site">
        <div>
          <strong id="etat-texte">État du site…</strong>
          <span id="etat-detail"></span>
        </div>
        <button type="button" class="bouton" id="basculer-site" disabled></button>
      </section>
      <ul class="chiffres" id="chiffres"></ul>
      <div class="outils">
        <input id="filtre" type="search" placeholder="Chercher un identifiant" aria-label="Chercher un identifiant" autocomplete="off">
        <button type="button" class="bouton" id="actualiser">↻ Actualiser</button>
      </div>
      <div class="defile">
        <table>
          <thead>
            <tr><th>Identifiant</th><th>Créé le</th><th>Dernière utilisation</th><th>Dernière sauvegarde</th><th>Taille</th><th>Actions</th></tr>
          </thead>
          <tbody id="lignes"></tbody>
        </table>
      </div>
      <p class="message" id="message" role="status"></p>
    </div>
  </main>

  <script>
    (function () {
      'use strict';
      // Le jeton est celui que le logiciel garde après la connexion (même adresse, donc même mémoire du navigateur).
      var jeton = null, identifiant = null;
      try {
        jeton = localStorage.getItem('boites-a-classer-compte:jeton');
        identifiant = localStorage.getItem('boites-a-classer-compte:identifiant');
      } catch (e) { /* stockage indisponible */ }

      var $ = function (s) { return document.querySelector(s); };
      var comptes = [];
      var resultats = {}; // identifiant → nouveau mot de passe à afficher sous sa ligne

      // Mots pour fabriquer un mot de passe facile à dicter à un élève (3 mots + 2 chiffres, environ 30 bits).
      var MOTS = ('abeille agneau aigle baleine bison castor chameau cheval chevre cigale cigogne crabe criquet cygne dauphin '
        + 'faucon fourmi gazelle girafe gorille grillon hamster hibou homard jaguar koala lapin lezard loutre marmotte merle '
        + 'mouette mouton panda phoque poney renard requin saumon souris tigre tortue truite zebre moineau pigeon canard '
        + 'blaireau chouette corbeau colibri toucan pelican flamant manchot otarie poulpe meduse etoile oursin crevette '
        + 'papillon libellule scarabee bourdon chenille escargot pomme poire prune cerise fraise myrtille banane ananas '
        + 'mangue citron orange melon raisin abricot carotte tomate radis navet poireau oignon salade courge potiron '
        + 'chene sapin bouleau erable saule tilleul olivier palmier bambou cactus fougere lavande menthe basilic nuage '
        + 'soleil lune pluie neige orage brume givre eclair comete planete galaxie riviere ruisseau ocean vague plage '
        + 'colline montagne volcan vallee foret prairie desert rocher caillou galet grotte cascade glacier velo train '
        + 'bateau avion fusee ballon tambour flute piano guitare violon trompette harpe crayon cahier compas loupe '
        + 'boussole lampe bougie chaise coussin panier arrosoir brouette echelle gateau tarte crepe biscuit caramel').split(' ');

      function motDePasseAuHasard() {
        var h = crypto.getRandomValues(new Uint32Array(4));
        return [MOTS[h[0] % MOTS.length], MOTS[h[1] % MOTS.length], MOTS[h[2] % MOTS.length], String(10 + h[3] % 90)].join('-');
      }

      // Même dérivation que le logiciel (app/app.js, secretDe) : le mot de passe ne part jamais tel quel.
      function secretDe(id, mdp) {
        var enc = new TextEncoder();
        return crypto.subtle.importKey('raw', enc.encode(mdp), 'PBKDF2', false, ['deriveBits']).then(function (cle) {
          return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', iterations: 600000, salt: enc.encode('boites-a-classer:compte:' + id) }, cle, 256);
        }).then(function (bits) {
          return btoa(String.fromCharCode.apply(null, new Uint8Array(bits))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        });
      }

      function appel(action, corps) {
        var options = { headers: { Authorization: 'Bearer ' + jeton } };
        if (corps) {
          options.method = 'POST';
          options.headers['Content-Type'] = 'application/json';
          options.body = JSON.stringify(corps);
        }
        return fetch('/api/admin/' + action, options).then(function (rep) {
          return rep.json().catch(function () { return {}; }).then(function (r) { return { statut: rep.status, r: r }; });
        });
      }

      function horsSession(raison) {
        $('#contenu').hidden = true;
        $('#deconnecter').hidden = !jeton;
        $('#hors-session').hidden = false;
        $('#raison').textContent = raison;
        $('#identifiant').focus();
      }

      // Connexion directement sur cette page (le logiciel peut être fermé pendant un arrêt du site).
      // Le jeton est gardé aux mêmes clés que le logiciel : on reste connecté des deux côtés.
      function garder(cle, valeur) {
        try { if (valeur === null) localStorage.removeItem(cle); else localStorage.setItem(cle, valeur); } catch (e) { /* stockage indisponible */ }
      }
      $('#form-connexion').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var id = $('#identifiant').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        var bouton = ev.target.querySelector('button');
        var erreur = $('#erreur-connexion');
        erreur.textContent = '';
        bouton.disabled = true;
        secretDe(id, $('#mdp').value).then(function (secret) {
          return fetch('/api/compte/connexion', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identifiant: id, secret: secret }),
          }).then(function (rep) { return rep.json().catch(function () { return {}; }).then(function (r) { return { statut: rep.status, r: r }; }); });
        }).then(function (x) {
          if (x.statut !== 200 || !x.r.jeton) { erreur.textContent = x.statut === 401 ? 'Identifiant ou mot de passe incorrect.' : (x.r.erreur || 'Le serveur a répondu ' + x.statut) + '.'; return; }
          jeton = x.r.jeton;
          identifiant = x.r.identifiant;
          garder('boites-a-classer-compte:jeton', jeton);
          garder('boites-a-classer-compte:identifiant', identifiant);
          garder('boites-a-classer-compte:admin', x.r.admin ? '1' : null);
          $('#mdp').value = '';
          charger();
        }).catch(function (e) { erreur.textContent = 'Impossible de joindre le serveur : ' + e.message; })
          .then(function () { bouton.disabled = false; });
      });

      $('#deconnecter').addEventListener('click', function () {
        var ancien = jeton;
        jeton = identifiant = null;
        ['jeton', 'identifiant', 'admin'].forEach(function (k) { garder('boites-a-classer-compte:' + k, null); });
        fetch('/api/compte/deconnexion', { method: 'POST', headers: { Authorization: 'Bearer ' + ancien } }).catch(function () {});
        $('#moi').textContent = '';
        horsSession('Déconnecté.');
      });

      /* Arrêt du site : tant qu'il dure, toutes les pages affichent « Boîtes à classer revient dans peu de temps… »
         (functions/_middleware.js), sauf cette page. */
      var siteArrete = null;
      function afficherEtat(arrete) {
        siteArrete = arrete;
        var b = $('#basculer-site');
        b.disabled = false;
        b.classList.remove('confirmer');
        $('#etat-site').classList.toggle('arrete', arrete);
        $('#etat-texte').textContent = arrete ? '🔒 Le site est arrêté' : '🟢 Le site est ouvert';
        $('#etat-detail').textContent = arrete
          ? 'Les visiteurs voient « Boîtes à classer revient dans peu de temps… ». Seule cette page reste accessible.'
          : 'Tout le monde peut utiliser le logiciel.';
        b.className = 'bouton ' + (arrete ? 'rouvrir' : 'arreter');
        b.textContent = arrete ? '🔓 Rouvrir le site' : '🔒 Arrêter le site';
      }
      function chargerEtat() {
        appel('maintenance').then(function (x) { if (x.statut === 200) afficherEtat(x.r.active); });
      }
      $('#basculer-site').addEventListener('click', function () {
        var b = $('#basculer-site');
        // Arrêter demande un second appui ; rouvrir se fait tout de suite.
        if (!siteArrete && !b.classList.contains('confirmer')) {
          b.classList.add('confirmer');
          b.textContent = 'Vraiment arrêter le site pour tout le monde ?';
          setTimeout(function () { if (b.classList.contains('confirmer')) afficherEtat(siteArrete); }, 4000);
          return;
        }
        b.disabled = true;
        appel('maintenance', { active: !siteArrete }).then(function (x) {
          if (x.statut !== 200) { message('Échec : ' + (x.r.erreur || 'serveur ' + x.statut) + '.', true); afficherEtat(siteArrete); return; }
          afficherEtat(x.r.active);
          message(x.r.active ? 'Site arrêté. Il faut quelques secondes pour que tout le monde voie le message.' : 'Site rouvert.');
        }).catch(function (e) { message('Impossible de joindre le serveur : ' + e.message, true); afficherEtat(siteArrete); });
      });

      function message(texte, erreur) {
        $('#message').textContent = texte;
        $('#message').classList.toggle('erreur', !!erreur);
      }

      var date = function (iso) {
        return iso ? new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
      };
      var taille = function (o) { return o == null ? '—' : o < 1024 * 1024 ? Math.max(1, Math.round(o / 1024)) + ' Ko' : (o / 1048576).toFixed(1).replace('.', ',') + ' Mo'; };

      function charger() {
        if (!jeton) { horsSession('Cette page est réservée aux comptes administrateurs : connecte-toi d\'abord.'); return; }
        appel('comptes').then(function (x) {
          if (x.statut === 401) { horsSession('Ta session a expiré : reconnecte-toi.'); return; }
          if (x.statut === 403) { horsSession('Le compte « ' + (identifiant || '?') + ' » n\'est pas administrateur.'); return; }
          if (x.statut !== 200) { horsSession('Le serveur a répondu ' + x.statut + '.'); return; }
          $('#hors-session').hidden = true;
          $('#contenu').hidden = false;
          $('#deconnecter').hidden = false;
          chargerEtat();
          $('#moi').textContent = 'Compte : ' + identifiant;
          var s = x.r.stats;
          $('#chiffres').replaceChildren.apply($('#chiffres'), [
            [s.comptes, 'comptes'], [s.codes, 'sauvegardes avec un code'], [s.versions, 'versions gardées'],
            [taille(s.taille), 'de place utilisée (5 Go offerts)'], [s.sessions, 'sessions ouvertes'],
          ].map(function (c) {
            var li = document.createElement('li');
            var n = document.createElement('strong');
            n.textContent = c[0];
            var t = document.createElement('span');
            t.textContent = c[1];
            li.append(n, t);
            return li;
          }));
          comptes = x.r.comptes;
          afficher();
        }).catch(function (e) { horsSession('Impossible de joindre le serveur : ' + e.message); });
      }

      function bouton(texte, action, classe) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'bouton' + (classe ? ' ' + classe : '');
        b.textContent = texte;
        b.addEventListener('click', action);
        return b;
      }

      function afficher() {
        var filtre = $('#filtre').value.trim().toLowerCase();
        var lignes = [];
        comptes.filter(function (c) { return c.identifiant.indexOf(filtre) !== -1; }).forEach(function (c) {
          var tr = document.createElement('tr');
          var nom = document.createElement('td');
          nom.textContent = c.identifiant;
          if (c.admin) {
            var badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = 'admin';
            nom.appendChild(badge);
          }
          tr.appendChild(nom);
          [date(c.cree), date(c.derniere), c.versions ? date(c.date) + ' (' + c.versions + ' v.)' : 'aucune'].forEach(function (t) {
            var td = document.createElement('td');
            td.textContent = t;
            tr.appendChild(td);
          });
          var tdTaille = document.createElement('td');
          tdTaille.className = 'nombre';
          tdTaille.textContent = taille(c.taille);
          tr.appendChild(tdTaille);

          var actions = document.createElement('td');
          actions.className = 'actions';
          var voir = document.createElement('a');
          voir.className = 'bouton';
          voir.textContent = '👁 Voir le travail';
          voir.href = '../app/index.html#consulter=' + encodeURIComponent(c.identifiant);
          if (!c.versions) voir.setAttribute('aria-disabled', 'true');
          actions.appendChild(voir);
          if (!c.admin) {
            actions.append(' ', bouton('🔑 Nouveau mot de passe', function (ev) { nouveauMotDePasse(c.identifiant, ev.currentTarget); }),
              ' ', bouton('Supprimer', function (ev) { supprimer(c.identifiant, ev.currentTarget); }, 'danger'));
          }
          tr.appendChild(actions);
          lignes.push(tr);

          if (resultats[c.identifiant]) {
            var res = document.createElement('tr');
            res.className = 'resultat';
            var td = document.createElement('td');
            td.colSpan = 6;
            td.append('Nouveau mot de passe de ' + c.identifiant + ' : ');
            var code = document.createElement('code');
            code.textContent = resultats[c.identifiant];
            td.append(code, ' — à donner à l’élève. Ses appareils ont été déconnectés ; le mot de passe pourra être changé dans 👤 → Changer de mot de passe.');
            res.appendChild(td);
            lignes.push(res);
          }
        });
        if (!lignes.length) {
          var tr = document.createElement('tr');
          var td = document.createElement('td');
          td.colSpan = 6;
          td.className = 'vide';
          td.textContent = comptes.length ? 'Aucun identifiant ne correspond.' : 'Aucun compte pour l\'instant.';
          tr.appendChild(td);
          lignes.push(tr);
        }
        $('#lignes').replaceChildren.apply($('#lignes'), lignes);
      }

      function nouveauMotDePasse(id, b) {
        var mdp = motDePasseAuHasard();
        b.disabled = true;
        message('Changement du mot de passe de ' + id + '…');
        secretDe(id, mdp).then(function (secret) { return appel('mot-de-passe', { identifiant: id, secret: secret }); }).then(function (x) {
          b.disabled = false;
          if (x.statut !== 204) { message('Échec : ' + (x.r.erreur || 'serveur ' + x.statut) + '.', true); return; }
          resultats[id] = mdp;
          message('');
          afficher();
        }).catch(function (e) { b.disabled = false; message('Impossible de joindre le serveur : ' + e.message, true); });
      }

      // Double appui : le premier arme le bouton pendant 4 secondes.
      function supprimer(id, b) {
        if (!b.classList.contains('confirmer')) {
          b.classList.add('confirmer');
          b.textContent = 'Supprimer ' + id + ' et son travail ?';
          setTimeout(function () { b.classList.remove('confirmer'); b.textContent = 'Supprimer'; }, 4000);
          return;
        }
        b.disabled = true;
        appel('suppression', { identifiant: id }).then(function (x) {
          if (x.statut !== 204) { b.disabled = false; message('Échec : ' + (x.r.erreur || 'serveur ' + x.statut) + '.', true); return; }
          delete resultats[id];
          message('Compte ' + id + ' supprimé.');
          charger();
        }).catch(function (e) { b.disabled = false; message('Impossible de joindre le serveur : ' + e.message, true); });
      }

      $('#filtre').addEventListener('input', afficher);
      $('#actualiser').addEventListener('click', function () { message(''); charger(); });
      charger();
    })();
  </script>
</body>
</html>
