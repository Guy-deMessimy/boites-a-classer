<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <!-- Prairie fleurie au bas de l'accueil (site/printemps/theme.css) : collines, cerisiers en fleurs, buissons, ruche,
       tulipes, marguerites et coquelicots. Répétée en largeur : les deux bords sont à la même hauteur. Dessin fait pour
       Boîtes à classer (GPL-3.0). -->
  <defs>
    <g id="tulipe">
      <path d="M0 0v-34" stroke="#3f9a35" stroke-width="3"/>
      <path d="M0-6q-13-5-12-22q7 9 12 14z" fill="#4cb03f"/>
      <path d="M-8-46q0 14 8 14t8-14l-4 5-4-8-4 8z"/>
    </g>
    <g id="marguerite">
      <path d="M0 0v-26" stroke="#3f9a35" stroke-width="2.5"/>
      <g fill="#fff" transform="translate(0 -30)">
        <ellipse ry="7" rx="2.8" cy="-6"/><ellipse ry="7" rx="2.8" cy="-6" transform="rotate(45)"/>
        <ellipse ry="7" rx="2.8" cy="-6" transform="rotate(90)"/><ellipse ry="7" rx="2.8" cy="-6" transform="rotate(135)"/>
        <ellipse ry="7" rx="2.8" cy="-6" transform="rotate(180)"/><ellipse ry="7" rx="2.8" cy="-6" transform="rotate(225)"/>
        <ellipse ry="7" rx="2.8" cy="-6" transform="rotate(270)"/><ellipse ry="7" rx="2.8" cy="-6" transform="rotate(315)"/>
        <circle r="4.2" fill="#ffc928"/>
      </g>
    </g>
    <g id="coquelicot">
      <path d="M0 0q-3-16 2-30" stroke="#3f9a35" stroke-width="2.5" fill="none"/>
      <g transform="translate(2 -34)" fill="#e63b2e">
        <circle cx="-5" cy="1" r="7"/><circle cx="5" cy="1" r="7"/><circle cy="-5" r="7" fill="#f2553f"/>
        <circle r="3.4" fill="#2a1a12"/>
      </g>
    </g>
    <g id="buisson" fill="#4fae43">
      <circle cx="-18" cy="-12" r="16"/><circle cx="2" cy="-20" r="20"/><circle cx="22" cy="-11" r="15"/>
      <circle cx="-6" cy="-24" r="4" fill="#ffd1e4"/><circle cx="12" cy="-14" r="3.5" fill="#fff"/><circle cx="-16" cy="-10" r="3" fill="#ffd1e4"/>
    </g>
    <g id="fleurs-cerisier">
      <circle cx="-38" cy="-8" r="34" fill="#ffc2dc"/><circle cx="0" cy="-30" r="42" fill="#ffb0d1"/>
      <circle cx="40" cy="-6" r="34" fill="#ffc2dc"/><circle cx="-12" cy="14" r="30" fill="#ff9fc6"/><circle cx="22" cy="16" r="28" fill="#ffb0d1"/>
      <g fill="#fff" opacity=".85"><circle cx="-24" cy="-36" r="5"/><circle cx="12" cy="-48" r="4"/><circle cx="36" cy="-16" r="4.5"/><circle cx="-46" cy="0" r="4"/><circle cx="4" cy="4" r="4"/></g>
      <g fill="#f06fa5"><circle cx="-6" cy="-14" r="3.5"/><circle cx="26" cy="-30" r="3"/><circle cx="-34" cy="-22" r="3"/><circle cx="16" cy="26" r="3"/><circle cx="-26" cy="18" r="3"/></g>
    </g>
  </defs>

  <!-- collines du fond -->
  <path d="M0 206C120 196 260 168 420 178S700 222 860 196 1080 216 1200 206V300H0z" fill="#b5e58c"/>
  <path d="M0 232C180 214 330 220 520 230S860 214 1000 220 1120 240 1200 232V300H0z" fill="#8fd46a"/>

  <!-- grand cerisier -->
  <path d="M236 246c4-30 2-52-6-78l10-2c4 12 6 22 8 32 6-16 16-28 30-36l6 7c-16 10-26 24-30 42-2 12-2 24 0 35z" fill="#8b5a3c"/>
  <path d="M232 178c-10-10-24-16-38-16l1-8c16 0 30 6 42 16z" fill="#8b5a3c"/>
  <use href="#fleurs-cerisier" x="238" y="132"/>
  <!-- petit cerisier -->
  <path d="M1012 232c2-18 0-30-4-44h8c3 12 4 26 2 44z" fill="#8b5a3c"/>
  <use href="#fleurs-cerisier" x="1012" y="168" transform="translate(1012 168) scale(.55) translate(-1012 -168)"/>

  <!-- buissons -->
  <use href="#buisson" x="96" y="236"/><use href="#buisson" x="420" y="234"/><use href="#buisson" x="660" y="228"/>

  <!-- ruche en paille sur sa souche -->
  <g transform="translate(860 224)">
    <rect x="-22" y="0" width="44" height="12" rx="3" fill="#8b5a3c"/>
    <path d="M-30 2c0-30 14-48 30-48s30 18 30 48z" fill="#f2b84b" stroke="#c98a1e" stroke-width="3"/>
    <path d="M-28-10h56M-24-22h48M-16-34h32" stroke="#c98a1e" stroke-width="3"/>
    <path d="M-7 2a7 7 0 0 1 14 0z" fill="#5a3a1e"/>
    <g fill="#2a1a12"><circle cx="40" cy="-40" r="2.5"/><circle cx="52" cy="-28" r="2.5"/><circle cx="-44" cy="-36" r="2.5"/></g>
    <g fill="#ffd23f"><circle cx="38" cy="-40" r="2"/><circle cx="50" cy="-28" r="2"/><circle cx="-46" cy="-36" r="2"/></g>
  </g>

  <!-- pétales qui tombent du cerisier -->
  <g fill="#ffb0d1">
    <ellipse cx="320" cy="150" rx="5" ry="3" transform="rotate(30 320 150)"/>
    <ellipse cx="352" cy="190" rx="4.5" ry="2.8" transform="rotate(-20 352 190)"/>
    <ellipse cx="166" cy="196" rx="4" ry="2.6" transform="rotate(50 166 196)"/>
    <ellipse cx="300" cy="214" rx="4" ry="2.6" transform="rotate(10 300 214)"/>
  </g>

  <!-- prairie du premier plan -->
  <path d="M0 256C200 246 400 250 600 258S1000 266 1200 256V300H0z" fill="#5fc14b"/>
  <path d="M0 280C200 272 420 278 640 282S1000 288 1200 280V300H0z" fill="#4caf3f"/>
  <path d="M40 262l3-12 3 11 4-14 2 15M330 266l3-12 3 11 4-14 2 15M560 268l3-12 3 11 4-14 2 15M790 262l3-12 3 11 4-14 2 15M1110 264l3-12 3 11 4-14 2 15" stroke="#3f9a35" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

  <!-- fleurs -->
  <use href="#tulipe" x="70" y="276" fill="#e8364f"/><use href="#tulipe" x="92" y="282" fill="#ffc928"/>
  <use href="#marguerite" x="150" y="278"/><use href="#coquelicot" x="196" y="272"/>
  <use href="#tulipe" x="282" y="280" fill="#ff6fa8"/><use href="#marguerite" x="318" y="284"/>
  <use href="#coquelicot" x="384" y="278"/><use href="#tulipe" x="452" y="282" fill="#e8364f"/>
  <use href="#tulipe" x="476" y="276" fill="#ff8a3d"/><use href="#marguerite" x="532" y="280"/>
  <use href="#coquelicot" x="604" y="282"/><use href="#tulipe" x="690" y="280" fill="#ffc928"/>
  <use href="#marguerite" x="730" y="276"/><use href="#tulipe" x="806" y="282" fill="#ff6fa8"/>
  <use href="#coquelicot" x="846" y="276"/><use href="#marguerite" x="912" y="282"/>
  <use href="#tulipe" x="964" y="278" fill="#e8364f"/><use href="#tulipe" x="988" y="284" fill="#ffc928"/>
  <use href="#coquelicot" x="1058" y="280"/><use href="#marguerite" x="1140" y="278"/>
</svg>
