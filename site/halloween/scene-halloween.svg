    <path d="M186 190c-20-14-34-30-40-52M146 138c-8-6-12-14-12-24M146 138c-14 0-26-6-34-16" stroke-width="6"/>
    <path d="M185 168c20-18 42-26 64-26M249 142c10-8 16-18 18-30M249 142c12 2 22 0 32-6" stroke-width="5"/>
    <path d="M184 146c-2-22 4-40 16-54M200 92c-2-12 0-22 6-30M200 92c10-4 16-10 20-20" stroke-width="4"/>
  </g>
  <!-- cimetière -->
