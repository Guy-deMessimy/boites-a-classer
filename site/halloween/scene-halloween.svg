<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <!-- Silhouettes au bas de l'accueil (site/halloween/theme.css) : arbre mort, cimetière, colline et maison hantée.
       Répétée en largeur : les deux bords sont à la même hauteur. Dessin fait pour Boîtes à classer (GPL-3.0). -->
  <defs>
    <radialGradient id="lueur" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffcf5a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- colline du fond -->
  <path d="M0 250C150 236 260 214 380 224S600 246 700 222 900 150 980 168 1120 236 1200 250V300H0z" fill="#1a0f2a"/>
  <!-- arbre mort -->
