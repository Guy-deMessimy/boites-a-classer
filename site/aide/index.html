<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service client · Boîtes à classer</title>
  <link rel="icon" href="../icone.png">
  <style>
    /* Service client : une conversation avec l'administrateur du site (functions/api/support/[action].js).
       Connecté : la conversation du compte, retrouvée partout. Sinon : celle de ce navigateur (jeton gardé ici). */
    @font-face {
      font-family: "Space Grotesk";
      font-weight: 300 700;
      font-display: swap;
      src: url(../polices/space-grotesk-latin.woff2) format("woff2");
    }
    :root {
      --fond: #f6f4ef;
      --carte: #ffffff;
      --encre: #1f2430;
      --doux: #5f6675;
      --ligne: #e2ddd2;
      --accent: #2f6fde;
      --accent-encre: #ffffff;
      --accent-doux: #e8effc;
      --faux: #c0392b;
      --ok: #1f9d55;
      --bulle-admin: #eef1f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #15171c;
        --carte: #1e2128;
        --encre: #ecedf0;
        --doux: #a3a8b4;
        --ligne: #30343d;
        --accent: #5b8ff0;
        --accent-encre: #0d1220;
        --accent-doux: #1f2a40;
        --faux: #ef6b5b;
        --ok: #4cc685;
        --bulle-admin: #262a33;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fond); color: var(--encre); font: 16px/1.5 "Space Grotesk", system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    a { color: var(--accent); }
    .retour { display: inline-block; margin-bottom: 12px; }
    h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 5vw, 2rem); }
    .intro { margin: 0 0 6px; color: var(--doux); }
    .qui { margin: 0 0 16px; padding: 8px 12px; border-radius: 12px; background: var(--accent-doux); font-size: .92rem; }
    .fil {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 140px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 16px;
      border: 1px solid var(--ligne);
      border-radius: 18px;
      background: var(--carte);
    }
    .bulle { max-width: 85%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .bulle.client { align-self: flex-end; background: var(--accent); color: var(--accent-encre); border-bottom-right-radius: 4px; }
    .bulle.admin { align-self: flex-start; background: var(--bulle-admin); border-bottom-left-radius: 4px; }
    .bulle small { display: block; margin-top: 2px; opacity: .75; font-size: .75rem; }
    .bulle.admin small::before { content: "Service client · "; font-weight: 600; }
    .vide { margin: auto; color: var(--doux); text-align: center; }
    .resolu { align-self: center; color: var(--ok); font-size: .85rem; font-weight: 600; }
    form { display: grid; gap: 8px; margin-top: 12px; }
    textarea {
      width: 100%;
      min-height: 6em;
      padding: .6rem .8rem;
      border: 1px solid var(--ligne);
      border-radius: 14px;
      background: var(--carte);
      color: var(--encre);
      font: inherit;
      resize: vertical;
    }
    .envoi { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .envoi p { margin: 0; color: var(--doux); font-size: .85rem; }
    .bouton {
      padding: .6rem 1.2rem;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-encre);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .bouton:disabled { opacity: .5; cursor: default; }
    .message { min-height: 1.5em; margin: 8px 0 0; font-weight: 600; }
    .message.erreur { color: var(--faux); }
  </style>
</head>
<body>
  <main>
    <a class="retour" href="../">← Boîtes à classer</a>
    <h1>💬 Service client</h1>
    <p class="intro">Une question, un problème, une idée ? Écrivez ici : l'administrateur du site vous répond sur cette page.</p>
    <p class="qui" id="qui"></p>

    <div class="fil" id="fil" aria-live="polite"></div>

    <form id="form">
      <label for="texte" class="intro">Votre message</label>
      <textarea id="texte" maxlength="2000" placeholder="Bonjour, …" required></textarea>
      <div class="envoi">
        <button type="submit" class="bouton" id="envoyer">Envoyer</button>
        <p>N'écrivez pas d'informations personnelles (adresse, téléphone, nom de famille).</p>
      </div>
    </form>
    <p class="message" id="message" role="status"></p>
  </main>

  <script>
    (function () {
      'use strict';
      var $ = function (s) { return document.querySelector(s); };
      var lire = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
      var garder = function (k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* stockage indisponible */ } };
      var CLE_JETON = 'boites-a-classer-compte:jeton'; // session du logiciel (même adresse)
      var CLE_SUPPORT = 'boites-a-classer-support:jeton'; // conversation de ce navigateur, sans compte

      var jetonCompte = lire(CLE_JETON);
      var jetonSupport = lire(CLE_SUPPORT);
      if (!jetonSupport) {
        jetonSupport = btoa(String.fromCharCode.apply(null, crypto.getRandomValues(new Uint8Array(32))))
          .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        garder(CLE_SUPPORT, jetonSupport);
      }
      var nbMessages = -1;

      function majQui() {
        var nom = lire('boites-a-classer-compte:identifiant');
        $('#qui').textContent = jetonCompte
          ? 'Connecté : ' + nom + '. Vous retrouverez cette conversation sur tous vos appareils.'
          : 'Vous n\'êtes pas connecté : la réponse s\'affichera ici, dans ce navigateur. Pour la retrouver sur un autre appareil, connectez-vous d\'abord dans le logiciel (bouton 👤).';
      }

      function appel(action, corps) {
        var entetes = jetonCompte ? { Authorization: 'Bearer ' + jetonCompte } : { 'X-Support-Jeton': jetonSupport };
        var options = { headers: entetes, cache: 'no-store' };
        if (corps) {
          options.method = 'POST';
          entetes['Content-Type'] = 'application/json';
          options.body = JSON.stringify(corps);
        }
        return fetch('/api/support/' + action, options).then(function (rep) {
          return rep.json().catch(function () { return {}; }).then(function (r) {
            // Session expirée : on continue sans compte, avec la conversation de ce navigateur.
            if (rep.status === 401 && jetonCompte) { jetonCompte = null; garder(CLE_JETON, null); majQui(); return appel(action, corps); }
            return { statut: rep.status, r: r };
          });
        });
      }

      var date = function (iso) { return new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };

      function afficher(r) {
        var fil = $('#fil');
        var bas = fil.scrollHeight - fil.scrollTop - fil.clientHeight < 40;
        if (!r.messages.length) {
          var vide = document.createElement('p');
          vide.className = 'vide';
          vide.textContent = 'Pas encore de message. Écrivez le premier ci-dessous !';
          fil.replaceChildren(vide);
        } else {
          fil.replaceChildren.apply(fil, r.messages.map(function (m) {
            var b = document.createElement('div');
            b.className = 'bulle ' + (m.auteur === 'admin' ? 'admin' : 'client');
            b.textContent = m.texte;
            var d = document.createElement('small');
            d.textContent = date(m.date);
            b.appendChild(d);
            return b;
          }));
          if (r.resolu) {
            var ok = document.createElement('p');
            ok.className = 'resolu';
            ok.textContent = '✓ Question réglée. Un nouveau message la rouvre.';
            fil.appendChild(ok);
          }
        }
        if (bas || r.messages.length !== nbMessages) fil.scrollTop = fil.scrollHeight;
        nbMessages = r.messages.length;
      }

      function charger() {
        return appel('fil').then(function (x) {
          if (x.statut !== 200) { $('#message').textContent = x.r.erreur || 'Le serveur a répondu ' + x.statut + '.'; $('#message').className = 'message erreur'; return; }
          afficher(x.r);
        }).catch(function () { /* hors connexion : on réessaiera */ });
      }

      $('#form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var texte = $('#texte').value.trim();
        if (!texte) return;
        var b = $('#envoyer');
        b.disabled = true;
        $('#message').className = 'message';
        $('#message').textContent = 'Envoi…';
        appel('envoyer', { texte: texte }).then(function (x) {
          if (x.statut !== 200) {
            $('#message').className = 'message erreur';
            $('#message').textContent = (x.r.erreur ? x.r.erreur.charAt(0).toUpperCase() + x.r.erreur.slice(1) : 'Le serveur a répondu ' + x.statut) + '.';
            return;
          }
          $('#texte').value = '';
          afficher(x.r);
          $('#message').textContent = 'Message envoyé : la réponse arrivera ici.';
        }).catch(function (e) {
          $('#message').className = 'message erreur';
          $('#message').textContent = 'Impossible de joindre le serveur : ' + e.message;
        }).then(function () { b.disabled = false; });
      });

      // Les réponses arrivent sans recharger la page.
      setInterval(function () { if (document.visibilityState === 'visible') charger(); }, 20000);
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') charger(); });

      majQui();
      charger();
    })();
  </script>
  <script src="/arret.js"></script>
</body>
</html>
