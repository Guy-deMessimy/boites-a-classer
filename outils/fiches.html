<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Fiches à imprimer</title>
  <!--
    Fiches générées à partir de ../app/collections.js.
    Paramètres : ?collection=<id>&version=eleve|corrige
    On peut aussi ouvrir ce fichier dans un navigateur et l'imprimer (A4 paysage).
  -->
  <style>
    @page { size: A4 landscape; margin: 12mm; }
    * { box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body {
      margin: 0;
      color: #1f2430;
      font: 11pt/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    }
    .page { break-after: page; padding: 0; }
    .page:last-child { break-after: auto; }
    @media screen {
      body { background: #e9e6df; }
      .page { width: 297mm; min-height: 210mm; margin: 10mm auto; padding: 12mm; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
    }

    .entete { display: flex; justify-content: space-between; align-items: baseline; gap: 12mm; border-bottom: 2px solid #1f2430; padding-bottom: 2mm; margin-bottom: 4mm; }
    .entete h1 { font-size: 15pt; margin: 0; }
    .entete .coll { color: #5f6675; font-size: 10pt; white-space: nowrap; }
    .eleve-champs { display: flex; gap: 10mm; margin: 0 0 4mm; font-size: 10pt; }
    .eleve-champs span { flex: 1; border-bottom: 1px dotted #888; padding-bottom: 1mm; }
    .eleve-champs span:first-child { flex: 2; }

    h2 { font-size: 12pt; margin: 0 0 1.5mm; }
    .consigne { margin: 0 0 4mm; color: #3c4250; font-size: 10pt; }

    table { border-collapse: collapse; margin: 0 auto; }
    th, td { border: 1px solid #555; text-align: center; vertical-align: middle; }
    thead th { height: 34mm; width: 11mm; padding: 1.5mm 0; font-weight: 600; font-size: 9.5pt; }
    thead th .vertical { writing-mode: vertical-rl; transform: rotate(180deg); display: inline-block; height: 31mm; white-space: normal; text-align: left; line-height: 1.15; }
    thead th.coin { width: auto; vertical-align: bottom; text-align: left; padding: 2mm; font-size: 9pt; color: #5f6675; font-weight: 400; }
    tbody th { text-align: left; padding: 0 3mm 0 2mm; font-weight: 500; white-space: nowrap; height: 8.6mm; }
    tbody th .ico { display: inline-block; width: 7mm; font-size: 12pt; }
    td { width: 11mm; height: 8.6mm; font-size: 13pt; font-weight: 700; }
    td.oui { color: #1f2430; }
    .compact tbody th, .compact td { height: 7.4mm; }

    .boites { display: flex; flex-wrap: wrap; gap: 3mm; align-items: flex-start; }
    .noeud { border: 2.2px solid var(--c); border-radius: 3mm; padding: 1.5mm 2mm 2mm; background: var(--f); display: flex; flex-direction: column; gap: 1.5mm; }
    .noeud > .titre { font-weight: 700; font-size: 9.5pt; color: var(--c); }
    .noeud > .contenu { display: flex; flex-wrap: wrap; gap: 2mm; align-items: flex-start; }
    .jeton { border: 1px solid #999; border-radius: 2mm; background: #fff; padding: .6mm 2mm; font-size: 9.5pt; white-space: nowrap; }
    .page.pleine { display: flex; flex-direction: column; height: 185mm; }
    @media screen { .page.pleine { height: 210mm; } }
    .cadre-dessin { flex: 1; border: 1.5px dashed #888; border-radius: 3mm; }
    .a-placer { display: flex; flex-wrap: wrap; gap: 2mm; margin-bottom: 3mm; }
  </style>
</head>
<body>
  <script src="../app/collections.js"></script>
  <script>
    (function () {
      'use strict';
      var PALETTE = ['#2f7ed8', '#e4572e', '#29a35a', '#8e5bd0', '#e8a10c', '#d6457b',
        '#17a2b8', '#7a8b23', '#b5651d', '#5465ff', '#c0392b', '#16a085'];
      var params = new URLSearchParams(location.search);
      var coll = COLLECTIONS.find(function (c) { return c.id === params.get('collection'); }) || COLLECTIONS[0];
      var corrige = params.get('version') === 'corrige';

      var attrs = coll.attributs.map(function (a, i) {
        return { id: a.id, nom: a.nom, couleur: a.couleur || PALETTE[i % PALETTE.length], rang: i };
      });
      var etres = coll.etres;
      var possede = function (e, a) { return e.attributs.indexOf(a.id) !== -1; };
      var membres = function (a) { return etres.filter(function (e) { return possede(e, a); }); };
      var fond = function (hex, al) {
        var n = parseInt(hex.slice(1), 16);
        return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + al + ')';
      };
      var el = function (tag, cls, txt) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (txt != null) n.textContent = txt;
        return n;
      };

      /* Tableau à double tri : colonnes de l'attribut le plus partagé au moins partagé,
         puis lignes rangées selon ces colonnes (ordre lexicographique, les croix d'abord).
         Les groupes emboîtés apparaissent alors en blocs. */
      var colsTriees = attrs.slice().sort(function (a, b) {
        return membres(b).length - membres(a).length || a.rang - b.rang;
      });
      var lignesTriees = etres.slice().sort(function (x, y) {
        for (var i = 0; i < colsTriees.length; i++) {
          var d = (possede(y, colsTriees[i]) ? 1 : 0) - (possede(x, colsTriees[i]) ? 1 : 0);
          if (d) return d;
        }
        return etres.indexOf(x) - etres.indexOf(y);
      });
      var lignesAlpha = etres.slice().sort(function (x, y) { return x.nom.localeCompare(y.nom, 'fr'); });

      function page() {
        var p = el('section', 'page');
        var t = el('div', 'entete');
        t.appendChild(el('h1', null, 'Classer les êtres vivants' + (corrige ? ' — corrigé' : '')));
        t.appendChild(el('span', 'coll', 'Collection : ' + coll.nom));
        p.appendChild(t);
        document.body.appendChild(p);
        return p;
      }

      function tableau(lignes, cols, remplir, colorer) {
        var tab = el('table', lignes.length >= 12 ? 'compact' : '');
        var thead = el('thead');
        var tr = el('tr');
        tr.appendChild(el('th', 'coin', 'Êtres vivants ↓   Attributs →'));
        cols.forEach(function (a) {
          var th = el('th');
          th.appendChild(el('span', 'vertical', a.nom));
          tr.appendChild(th);
        });
        thead.appendChild(tr);
        tab.appendChild(thead);
        var tbody = el('tbody');
        lignes.forEach(function (e) {
          var r = el('tr');
          var th = el('th');
          th.appendChild(el('span', 'ico', e.emoji || ''));
          th.appendChild(document.createTextNode(e.nom));
          r.appendChild(th);
          cols.forEach(function (a) {
            var oui = possede(e, a);
            var td = el('td', oui && remplir ? 'oui' : '', oui && remplir ? '✕' : '');
            if (oui && remplir && colorer) td.style.background = fond(a.couleur, 0.28);
            r.appendChild(td);
          });
          tbody.appendChild(r);
        });
        tab.appendChild(tbody);
        return tab;
      }

      /* Arbre des boîtes : chaque attribut va dans la plus petite boîte qui le contient.
         Les attributs partagés par exactement les mêmes êtres vivants forment une seule boîte. */
      function arbreBoites() {
        var noeuds = [];
        colsTriees.forEach(function (a) {
          var m = membres(a);
          if (!m.length) return;
          var cle = m.map(function (e) { return e.id; }).sort().join('|');
          var meme = noeuds.find(function (n) { return n.cle === cle; });
          if (meme) { meme.attrs.push(a); return; }
          noeuds.push({ cle: cle, attrs: [a], membres: m, enfants: [], parent: null });
        });
        var inclus = function (petit, grand) {
          return petit.membres.every(function (e) { return grand.membres.indexOf(e) !== -1; });
        };
        noeuds.forEach(function (n, i) {
          for (var j = i - 1; j >= 0; j--) {
            if (inclus(n, noeuds[j]) && (!n.parent || noeuds[j].membres.length < n.parent.membres.length)) n.parent = noeuds[j];
          }
          if (n.parent) n.parent.enfants.push(n);
        });
        return { racines: noeuds.filter(function (n) { return !n.parent; }), noeuds: noeuds };
      }

      function dessinerNoeud(n) {
        var d = el('div', 'noeud');
        var c = n.attrs[0].couleur;
        d.style.setProperty('--c', c);
        d.style.setProperty('--f', fond(c, 0.07));
        d.appendChild(el('div', 'titre', n.attrs.map(function (a) { return a.nom; }).join(', ')));
        var contenu = el('div', 'contenu');
        var dansEnfants = function (e) {
          return n.enfants.some(function (k) { return k.membres.indexOf(e) !== -1; });
        };
        n.membres.filter(function (e) { return !dansEnfants(e); }).forEach(function (e) {
          contenu.appendChild(el('span', 'jeton', (e.emoji ? e.emoji + ' ' : '') + e.nom));
        });
        n.enfants.forEach(function (k) { contenu.appendChild(dessinerNoeud(k)); });
        d.appendChild(contenu);
        return d;
      }

      // Page 1 : tableau à double entrée
      var p1 = page();
      if (!corrige) {
        var champs = el('div', 'eleve-champs');
        ['Nom et prénom :', 'Classe :', 'Date :'].forEach(function (t) { champs.appendChild(el('span', null, t)); });
        p1.appendChild(champs);
      }
      p1.appendChild(el('h2', null, '1. Tableau à double entrée'));
      p1.appendChild(el('p', 'consigne', corrige
        ? 'Chaque croix indique que l\'être vivant possède l\'attribut.'
        : 'Pour chaque être vivant, mets une croix (✕) dans la colonne de chaque attribut qu\'il possède.'));
      p1.appendChild(tableau(lignesAlpha, attrs, corrige, false));

      // Page 2 : tableau à double tri
      var p2 = page();
      p2.appendChild(el('h2', null, '2. Tableau à double tri'));
      p2.appendChild(el('p', 'consigne', corrige
        ? 'Colonnes rangées de l\'attribut le plus partagé au moins partagé, lignes rangées selon ces colonnes : les groupes emboîtés apparaissent en blocs de croix.'
        : 'Les colonnes et les lignes ont été rangées dans un autre ordre. Recopie tes croix : que remarques-tu ? Des blocs de croix apparaissent : ce sont les groupes emboîtés.'));
      p2.appendChild(tableau(lignesTriees, colsTriees, corrige, corrige));

      // Page 3 : les boîtes emboîtées
      var p3 = page();
      p3.appendChild(el('h2', null, '3. Les boîtes emboîtées'));
      if (corrige) {
        p3.appendChild(el('p', 'consigne', 'Chaque boîte regroupe les êtres vivants qui partagent son attribut. Une boîte placée dans une autre possède aussi l\'attribut de la grande boîte.'));
        var zone = el('div', 'boites');
        arbreBoites().racines.forEach(function (n) { zone.appendChild(dessinerNoeud(n)); });
        p3.appendChild(zone);
      } else {
        p3.appendChild(el('p', 'consigne', 'À l\'aide du tableau à double tri, dessine les boîtes emboîtées : une boîte par attribut, avec son nom. Écris le nom de chaque être vivant dans la plus petite boîte qui lui correspond.'));
        var liste = el('div', 'a-placer');
        etres.forEach(function (e) { liste.appendChild(el('span', 'jeton', (e.emoji ? e.emoji + ' ' : '') + e.nom)); });
        p3.appendChild(liste);
        p3.classList.add('pleine');
        p3.appendChild(el('div', 'cadre-dessin'));
      }

      document.title = coll.nom + (corrige ? ' — corrigé' : ' — fiche élève');
      document.body.dataset.pret = '1';
    })();
  </script>
</body>
</html>
